<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>
  <style>
    body {
      background: linear-gradient(to right, #ffe0f0, #ffe5ec);
      text-align: center;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: #d6336c;
      font-size: 5em;
      margin: 20px;
      animation: bounce 1s infinite;
    }

    .balloon {
      width: 60px;
      height: 90px;
      background: red;
      border-radius: 50% 50% 50% 50%;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .balloon::after {
      content: '';
      width: 2px;
      height: 40px;
      background: black;
      position: absolute;
      top: 90px;
      left: 29px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
      100% { transform: translateY(0); }
    }
  </style>
  <script>
    window.onload = function() {
      alert("Happy Birthday!");
      document.getElementById("music").play();
    };
  </script>
</head>
<body>
  <div class="container">
    <h1>🎉 נתנאל מה אתה עושה by hagaithescripter 🎉</h1> <!-- Change this text here -->
    <div class="balloon"></div>
  </div>

  <!-- Background Music -->
  <audio id="music" autoplay>
    <source src="https://www.youtube.com/watch?v=f_D6LyINETg" type="audio/mpeg">
    Your browser does not support the audio tag.
  </audio>
</body>
</html>
